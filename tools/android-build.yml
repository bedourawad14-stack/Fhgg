# Copy this file to  .github/workflows/android.yml  in your repo.
# Repo layout expected: public/  tools/  FILES_MANIFEST.txt  android/   (as in the zip)
# Updated for current (2026) toolchains: AGP 8.13.x / Gradle 8.13+ need JDK 21,
# and Node 20 is end-of-life, so both are bumped along with the Actions themselves.
name: Build Android APK & AAB
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Stop here if any game file is missing or broken
        run: node tools/check.mjs public
      - name: Copy the game into the Android project (after any cap sync, never before)
        run: node tools/install-to-android.mjs .
      - name: Build the debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Build the debug AAB (App Bundle)
        run: cd android && ./gradlew bundleDebug
      - name: Verify the APK really contains every file
        run: |
          mkdir apkx && cd apkx
          unzip -q ../android/app/build/outputs/apk/debug/app-debug.apk 'assets/public/*'
          cd .. && node tools/check.mjs apkx/assets/public
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug-aab
          path: android/app/build/outputs/bundle/debug/app-debug.aab

# Notes for a signed RELEASE build (not run here, no secrets configured):
#   - Release AAB/APK need a keystore + android/keystore.properties (kept out of git)
#     referenced from android/app/build.gradle, then:
#       ./gradlew bundleRelease   ->  android/app/build/outputs/bundle/release/app-release.aab
#       ./gradlew assembleRelease ->  android/app/build/outputs/apk/release/app-release.apk
#   - Current (2026) Capacitor/Android baseline these commands expect:
#       JDK 21, Android Gradle Plugin 8.13.x, Gradle wrapper 8.13+,
#       compileSdk/targetSdk 36, minSdk 24.
#     If android/build.gradle, android/gradle/wrapper/gradle-wrapper.properties or
#     android/app/build.gradle pin older numbers, bump those to match before building.
