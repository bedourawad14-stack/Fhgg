name: Download Drive project and build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow
        uses: actions/checkout@v4

      - name: Download project ZIP from Google Drive
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check gdown
          mkdir -p "$RUNNER_TEMP/project"
          gdown "1AcmaJCuoFyYeggztggUNyIsS1ya9UcVa" -O "$RUNNER_TEMP/project.zip"
          if ! unzip -tq "$RUNNER_TEMP/project.zip"; then
            echo "The Google Drive file could not be downloaded as a valid ZIP."
            echo "Make sure its sharing setting is 'Anyone with the link - Viewer'."
            exit 1
          fi
          unzip -q "$RUNNER_TEMP/project.zip" -d "$RUNNER_TEMP/project"

      - name: Detect project type
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/project"

          FLUTTER_FILE="$(find "$ROOT" -name pubspec.yaml -not -path '*/.dart_tool/*' -not -path '*/node_modules/*' -print -quit)"
          if [ -n "$FLUTTER_FILE" ]; then
            PROJECT_DIR="$(dirname "$FLUTTER_FILE")"
            echo "type=flutter" >> "$GITHUB_OUTPUT"
            echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SETTINGS_FILE="$(find "$ROOT" \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/.gradle/*' -not -path '*/node_modules/*' -print -quit)"
          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
            echo "type=gradle" >> "$GITHUB_OUTPUT"
            echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BUILD_FILE="$(find "$ROOT" \( -name build.gradle -o -name build.gradle.kts \) -not -path '*/.gradle/*' -not -path '*/node_modules/*' -print -quit)"
          if [ -n "$BUILD_FILE" ]; then
            PROJECT_DIR="$(dirname "$BUILD_FILE")"
            if [ "$(basename "$PROJECT_DIR")" = "app" ]; then
              PROJECT_DIR="$(dirname "$PROJECT_DIR")"
            fi
            echo "type=gradle" >> "$GITHUB_OUTPUT"
            echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          WEB_INDEX="$(find "$ROOT" -name index.html -not -path '*/node_modules/*' -not -path '*/.git/*' -print -quit)"
          if [ -n "$WEB_INDEX" ]; then
            PROJECT_DIR="$(dirname "$WEB_INDEX")"
            echo "type=web" >> "$GITHUB_OUTPUT"
            echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
            echo "Detected browser/web project at: $PROJECT_DIR"
            exit 0
          fi

          echo "Unsupported ZIP. No Flutter, Android Gradle, or web index.html project was found."
          echo "Top-level files for diagnosis:"
          find "$ROOT" -maxdepth 3 -type f | head -80
          exit 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        if: steps.detect.outputs.type == 'web'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ''

      - name: Set up Flutter
        if: steps.detect.outputs.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Flutter APK
        if: steps.detect.outputs.type == 'flutter'
        working-directory: ${{ steps.detect.outputs.dir }}
        run: |
          flutter pub get
          flutter build apk --release

      - name: Build Android Gradle APK
        if: steps.detect.outputs.type == 'gradle'
        working-directory: ${{ steps.detect.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            echo "No Gradle wrapper found; cannot safely infer the required Gradle version."
            echo "Add the project's gradlew wrapper files and try again."
            exit 1
          fi

      - name: Package browser project as Android app
        if: steps.detect.outputs.type == 'web'
        shell: bash
        env:
          WEB_PROJECT_DIR: ${{ steps.detect.outputs.dir }}
        run: |
          set -euo pipefail
          cd "$WEB_PROJECT_DIR"

          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then
              npm ci
            elif [ -f npm-shrinkwrap.json ]; then
              npm install
            else
              npm install
            fi

            if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
              npm run build
            fi
          fi

          WEB_OUTPUT=""
          for candidate in dist build www out; do
            if [ -f "$WEB_PROJECT_DIR/$candidate/index.html" ]; then
              WEB_OUTPUT="$WEB_PROJECT_DIR/$candidate"
              break
            fi
          done
          if [ -z "$WEB_OUTPUT" ] && [ -f "$WEB_PROJECT_DIR/index.html" ]; then
            WEB_OUTPUT="$WEB_PROJECT_DIR"
          fi
          if [ -z "$WEB_OUTPUT" ]; then
            echo "Web build did not produce index.html in the project root or dist/build/www/out."
            echo "Check the build script and its output directory."
            exit 1
          fi

          APP_DIR="$RUNNER_TEMP/capacitor-wrapper"
          mkdir -p "$APP_DIR/www"
          cp -a "$WEB_OUTPUT"/. "$APP_DIR/www/"
          cd "$APP_DIR"
          npm init -y
          npm install --save-exact @capacitor/core@6.2.1 @capacitor/android@6.2.1
          npm install --save-dev --save-exact @capacitor/cli@6.2.1
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.fhgg.browserapp",
            "appName": "Browser App",
            "webDir": "www"
          }
          EOF
          npx cap add android
          npx cap sync android
          cd android
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Collect APK files
        shell: bash
        env:
          PROJECT_TYPE: ${{ steps.detect.outputs.type }}
          PROJECT_DIR: ${{ steps.detect.outputs.dir }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apk-output"
          if [ "$PROJECT_TYPE" = "flutter" ]; then
            find "$PROJECT_DIR/build/app/outputs/flutter-apk" -type f -name '*.apk' -exec cp {} "$RUNNER_TEMP/apk-output/" \;
          elif [ "$PROJECT_TYPE" = "web" ]; then
            find "$RUNNER_TEMP/capacitor-wrapper/android" -type f -path '*/build/outputs/apk/*/*.apk' -exec cp {} "$RUNNER_TEMP/apk-output/" \;
          else
            find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/*/*.apk' -exec cp {} "$RUNNER_TEMP/apk-output/" \;
          fi
          if ! find "$RUNNER_TEMP/apk-output" -type f -name '*.apk' | grep -q .; then
            echo "Build completed but no APK was produced."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ runner.temp }}/apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
