name: Download Drive project and build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow
        uses: actions/checkout@v4

      - name: Download project ZIP from Google Drive
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check gdown
          mkdir -p "$RUNNER_TEMP/project"
          gdown --fuzzy "https://drive.google.com/file/d/1AcmaJCuoFyYeggztggUNyIsS1ya9UcVa/view?usp=drivesdk" -O "$RUNNER_TEMP/project.zip"
          if ! unzip -tq "$RUNNER_TEMP/project.zip"; then
            echo "The Google Drive file could not be downloaded as a valid ZIP."
            echo "Make sure its sharing setting is 'Anyone with the link - Viewer'."
            exit 1
          fi
          unzip -q "$RUNNER_TEMP/project.zip" -d "$RUNNER_TEMP/project"

      - name: Detect project type
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/project"
          FLUTTER_FILE="$(find "$ROOT" -name pubspec.yaml -not -path '*/.dart_tool/*' -print -quit)"
          if [ -n "$FLUTTER_FILE" ]; then
            PROJECT_DIR="$(dirname "$FLUTTER_FILE")"
            echo "type=flutter" >> "$GITHUB_OUTPUT"
            echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SETTINGS_FILE="$(find "$ROOT" \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/.gradle/*' -print -quit)"
          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          else
            BUILD_FILE="$(find "$ROOT" \( -name build.gradle -o -name build.gradle.kts \) -not -path '*/.gradle/*' -print -quit)"
            if [ -z "$BUILD_FILE" ]; then
              echo "Unsupported ZIP: no Flutter pubspec.yaml or Android Gradle build files found."
              exit 1
            fi
            PROJECT_DIR="$(dirname "$BUILD_FILE")"
            if [ "$(basename "$PROJECT_DIR")" = "app" ]; then
              PROJECT_DIR="$(dirname "$PROJECT_DIR")"
            fi
          fi
          echo "type=gradle" >> "$GITHUB_OUTPUT"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        if: steps.detect.outputs.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Flutter APK
        if: steps.detect.outputs.type == 'flutter'
        working-directory: ${{ steps.detect.outputs.dir }}
        run: |
          flutter pub get
          flutter build apk --release

      - name: Build Android Gradle APK
        if: steps.detect.outputs.type == 'gradle'
        working-directory: ${{ steps.detect.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            echo "No Gradle wrapper found; cannot safely infer the required Gradle version."
            echo "Add the project's gradlew wrapper files and try again."
            exit 1
          fi

      - name: Collect APK files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apk-output"
          if [ "${{ steps.detect.outputs.type }}" = "flutter" ]; then
            find "${{ steps.detect.outputs.dir }}/build/app/outputs/flutter-apk" -type f -name '*.apk' -exec cp {} "$RUNNER_TEMP/apk-output/" \;
          else
            find "${{ steps.detect.outputs.dir }}" -type f -path '*/build/outputs/apk/*/*.apk' -exec cp {} "$RUNNER_TEMP/apk-output/" \;
          fi
          if ! find "$RUNNER_TEMP/apk-output" -type f -name '*.apk' | grep -q .; then
            echo "Build completed but no APK was produced."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ runner.temp }}/apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
