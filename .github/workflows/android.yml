name: Import Google Drive files into repository

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: drive-import-main
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and extract Google Drive archive
        run: |
          python -m pip install --upgrade gdown
          mkdir -p incoming drive-project
          gdown --id "13A-gOYikLEWlBraBgG_1DO_k8HASkXhO" -O incoming/project.zip
          test -s incoming/project.zip
          unzip -q -o incoming/project.zip -d drive-project
          test "$(find drive-project -mindepth 1 | wc -l)" -gt 0
          echo "Extracted files:"
          find drive-project -maxdepth 3 -type f | head -200

      - name: Commit extracted files to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A drive-project
          if git diff --cached --quiet; then
            echo "No changes to import."
            exit 0
          fi
          git commit -m "import: add extracted Google Drive project files"
          git push origin HEAD:main
