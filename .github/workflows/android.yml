name: Build Android from Google Drive archive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout build workflow
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download new project archive from Google Drive
        run: |
          python -m pip install --upgrade gdown
          mkdir -p incoming project
          gdown --id "13A-gOYikLEWlBraBgG_1DO_k8HASkXhO" -O incoming/project.zip
          test -s incoming/project.zip
          unzip -q incoming/project.zip -d project

      - name: Locate project root and install Android tooling
        run: |
          ROOT="$(find project -type f -path '*/public/index.html' -print -quit | sed 's#/public/index.html$##')"
          if [ -z "$ROOT" ]; then
            ROOT="$(find project -type f -name capacitor.config.json -print -quit | xargs -r dirname)"
          fi
          if [ -z "$ROOT" ] || [ ! -d "$ROOT" ]; then
            echo "Could not identify project root in the Drive archive."
            find project -maxdepth 3 -type f | head -200
            exit 1
          fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          rsync -a --delete --exclude='.github/' "$ROOT/" ./workspace/
          test -s workspace/package.json
          test -s workspace/public/index.html
          test -d workspace/public

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install dependencies and Capacitor Android
        working-directory: workspace
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps --no-save @capacitor/core@8 @capacitor/android@8 @capacitor/cli@8

      - name: Configure and sync Android project
        working-directory: workspace
        run: |
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.js ]; then
            cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.shawari.alsaudia",
            "appName": "شوارع السعودية",
            "webDir": "public",
            "android": { "allowMixedContent": false }
          }
          EOF
          fi
          npx cap add android
          npx cap sync android

      - name: Build debug APK and AAB
        working-directory: workspace/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shawari-alsaudia-new-debug-apk
          path: workspace/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: shawari-alsaudia-new-debug-aab
          path: workspace/android/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
          retention-days: 14
