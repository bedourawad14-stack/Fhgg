name: Android APK and AAB

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "tools/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository and Git LFS files
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Check game entry point and required assets
        run: |
          test -s public/index.html
          test -s public/assets/index-BF96lAir.js
          test -d public/models
          test -d public/textures

      - name: Install Capacitor Android tooling
        run: npm install --legacy-peer-deps --no-save --no-package-lock @capacitor/core@8 @capacitor/android@8 @capacitor/cli@8

      - name: Configure Android app
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.shawari.alsaudia",
            "appName": "شوارع السعودية",
            "webDir": "public",
            "android": {
              "allowMixedContent": false
            }
          }
          EOF
          npx cap add android

      - name: Copy game files into Android assets
        run: |
          npx cap sync android
          while IFS= read -r -d '' file; do
            rel="${file#public/}"
            cmp "$file" "android/app/src/main/assets/public/$rel"
          done < <(find public -type f -print0)

      - name: Build debug APK and AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleDebug

      - name: Verify game assets inside APK
        run: |
          mkdir -p apk-check
          cd apk-check
          unzip -q ../android/app/build/outputs/apk/debug/app-debug.apk 'assets/public/*'
          cd ..
          while IFS= read -r -d '' file; do
            rel="${file#public/}"
            cmp "$file" "apk-check/assets/public/$rel"
          done < <(find public -type f -print0)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shawari-alsaudia-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: shawari-alsaudia-debug-aab
          path: android/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
          retention-days: 14
