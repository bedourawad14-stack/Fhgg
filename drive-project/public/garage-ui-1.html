<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>كراج السعودية</title>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<!--
==================================================================
              رسالة للمطور  (سرية - ما تظهر لأي لاعب)
==================================================================
الواجهة جاهزة 100% والمنتصف فاضي عن قصد. اللي عليك:

1) السيارة
   - حط ملف السيارة (png / webp) في مشروعك
   - اكتب مساره: CONFIG.CAR_IMAGE_URL = 'car.png'  (دور على "★ مكان السيارة ★")
   - مجسم 3D:  GameBridge.mountCar = (el) => { ...; return true }

2) رسالة الترحيب (تطلع أول ما اللاعب يدخل)
   - تعريف اللعبة فاضي عن قصد. اكتبه هنا:  CONFIG.WELCOME_TEXT = '...'
     (يتعرض كنص عادي فقط، آمن من XSS)  والعنوان: CONFIG.WELCOME_TITLE
   - متى تطلع: CONFIG.WELCOME = 'once' (أول دخول فقط - الافتراضي) | 'always' (كل دخول) | 'off'
     وبعدها المتجر يطلع بس لما اللاعب يضغط زر 🛒
   - تعرض ميزات الشراء والاشتراك تلقائياً من المصفوفة PRODUCTS.

3) الاشتراك الشهري (12 ريال)
   - يفتح كل شيء: المحركات الـ50 + الصبغات + الدخان + اللوحة + نقاط غير محدودة (∞)،
     وكل شيء في المتجر يكتب "تم الشراء" طول فترة الاشتراك. الرصيد الحقيقي للنقاط يرجع بعد الانتهاء.
   - مدته شهر ميلادي كامل (28/29/30/31 يوم حسب التاريخ) وبعدها تنسحب كل ميزاته
     تلقائياً ويرجع المتجر مفتوح للشراء، واللاعب يجدد. المشتريات الدائمة الثانية ما تنسحب.
   - ⚠️ فحص الانتهاء هنا للعرض فقط. المرجع الحقيقي لازم يكون السيرفر (شوف الأمن تحت).

4) الدفع الحقيقي (مو شغال حالياً)
   GameBridge.purchase = async (product) => true | false   (لازم true بالضبط)
   ⚠️⚠️ خل CONFIG.DEV_DEMO_MODE = false قبل النشر، وإلا أي لاعب ياخذ كل شيء مجاناً!

5) زر انطلق: GameBridge.onStart = (state) => {...}
   مراقبة التغييرات: GameBridge.onChange = (state) => {...}

6) الأمن السيبراني - مطلوب منك تأمّن اللعبة كلها
   اللي مسويه في الواجهة:
     - تنظيف كل مدخلات اللاعب (اللوحة) ومنع حقن الأكواد، والنصوص تنعرض textContent
     - فحص وتنظيف بيانات الحفظ (whitelist) + توقيع للكشف عن التلاعب بالـ localStorage
     - الشراء ينجح فقط لو رجع true بالضبط، وجداول المنتجات والمحركات مجمّدة (frozen)
     - حماية من رجوع ساعة الجهاز للخلف لتمديد الاشتراك
     - سياسة CSP تمنع تحميل أي سكربت خارجي
   اللي لازم تسويه أنت (الأهم، لأن أي كود في المتصفح ممكن يتعدّل):
     - كل شيء مهم يكون على السيرفر: الرصيد، المشتريات، الاشتراك وتاريخ انتهائه (بوقت السيرفر)
     - تحقق من إيصالات الدفع من السيرفر لسيرفر (Apple / Google Play / بوابة الدفع) وتحقق
       توقيع الـ webhooks، ولا تثق بأي قيمة تجي من اللاعب
     - تجديد وإلغاء الاشتراك يجي من المتجر عن طريق الـ webhooks
     - تسجيل دخول وتوكنات قصيرة العمر، HTTPS فقط، Rate limiting، ومنع تكرار الطلبات
     - لا تحط مفاتيح سرية في الكود، فعّل HEADERS: CSP + HSTS + X-Content-Type-Options
       + frame-ancestors، وسوي تصغير/تشويش للكود، وراجع المكتبات (dependency audit)
     - سجّل العمليات الغريبة وسوي اختبار اختراق قبل الإطلاق
   (لو احتجت اتصال بسيرفر عدّل connect-src في سياسة CSP أعلى الملف)
==================================================================
-->
<style>
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{--bg:#04070a;--pn:#0a1219;--ln:#16262f;--em:#19e08c;--gold:#ffc83d;--ruby:#ff3b5c;--ice:#7dd3fc;--tx:#eaf6f1;--mut:#7f9a96;--glow:#19e08c;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:Tajawal,system-ui,sans-serif;overflow:hidden;padding-top:var(--sat);padding-bottom:var(--sab)}
button{font-family:inherit}
#app{position:relative;height:100%;display:flex;flex-direction:column;max-width:900px;margin:auto;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.drift{animation:dr 40s ease-in-out infinite alternate}
@keyframes dr{to{transform:translate(-14px,10px) scale(1.03)}}
.flow{stroke-dasharray:6 8;animation:fl 2s linear infinite}
@keyframes fl{to{stroke-dashoffset:-28}}
.vig{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 30%,#04070acc 80%)}
.top{position:relative;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 12px;pointer-events:none}
.top>*{pointer-events:auto}
.sp{flex:1;pointer-events:none!important}
.chip{display:flex;align-items:center;gap:6px;background:#0a1219dd;border:1.5px solid var(--gold);border-radius:30px;padding:4px 5px 4px 12px;font-weight:900;color:var(--gold);backdrop-filter:blur(8px);box-shadow:0 0 18px #ffc83d33}
.chip b{font-size:16px;min-width:46px;text-align:center}
.plus{width:30px;height:30px;border-radius:50%;border:0;background:linear-gradient(135deg,#ffe07a,#f2a900);color:#000;font-size:22px;font-weight:900;cursor:pointer;line-height:1;animation:pls 2.2s infinite}
@keyframes pls{50%{transform:scale(1.12)}}
.lv{display:flex;align-items:center;gap:7px;cursor:pointer}
.av{width:38px;height:38px;border-radius:50%;background:conic-gradient(var(--em),var(--gold),var(--em));display:grid;place-items:center;font-size:19px;position:relative}
.av::after{content:"";position:absolute;inset:2px;border-radius:50%;background:#0a1219;z-index:0}.av span{position:relative;z-index:1}
.lvt{font-size:11px;font-weight:700;color:var(--mut);line-height:1.2}.lvt b{color:var(--tx);font-size:13px;display:block}
.xp{width:62px;height:4px;background:#16262f;border-radius:3px;overflow:hidden}.xp i{display:block;height:100%;background:var(--em);transition:width .6s}
.ib{position:relative;width:42px;height:42px;border-radius:14px;border:1.5px solid #19e08c88;background:#0a1219dd;font-size:20px;cursor:pointer;color:#fff;backdrop-filter:blur(8px)}
.ib.dot::after{content:"";position:absolute;top:-3px;left:-3px;width:12px;height:12px;border-radius:50%;background:var(--ruby);animation:pls 1s infinite}
.quick{position:relative;z-index:6;display:flex;gap:8px;justify-content:center;padding:4px 12px 0}
.qc{display:flex;align-items:center;gap:6px;background:#0a1219dd;border:1.5px solid var(--em);color:var(--em);border-radius:20px;padding:7px 14px;font:700 13px Tajawal;backdrop-filter:blur(8px);cursor:pointer}
.qc span{font-size:16px}
.stage{position:relative;z-index:3;flex:1;min-height:200px;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.eh{position:absolute;top:0;width:100%;text-align:center}
.en{font:400 15px Lalezar;margin-inline-start:6px;text-shadow:0 0 12px var(--glow)}
.rb{display:inline-block;font-size:10px;font-weight:900;padding:0 8px;border-radius:8px}
.pills{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin-top:3px;padding:0 10px}
.pills b{font-size:10px;color:var(--mut);background:#0a1219aa;border:1px solid var(--ln);border-radius:8px;padding:0 7px;font-weight:700}.pills i{font-style:normal;color:var(--gold);font-weight:900}
#carSlot{position:absolute;left:50%;bottom:6px;width:80%;height:92%;transform:translateX(-50%);display:flex;align-items:flex-end;justify-content:center;perspective:900px}
#carSlot:empty{display:none}
#carSlot>*{max-width:100%;max-height:100%;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotateY(360deg)}}
.lq *{animation-duration:0s!important}.lq .tt div{animation:none!important}
.plate{display:flex;background:#fff;color:#000;border-radius:6px;border:2px solid #000;font:900 15px Tajawal;overflow:hidden;direction:ltr;letter-spacing:2px}
.plate i{background:#0a58c9;color:#fff;font-size:7px;padding:2px 3px;display:grid;place-items:center;font-style:normal;letter-spacing:0}.plate span{padding:2px 6px}
.chp{width:38px;height:38px;border-radius:12px;background:#0a1219cc;border:1.5px solid var(--ln);display:grid;place-items:center;font-size:20px}
.tabs,.fl{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.tab,.fc{flex:none;padding:7px 14px;border-radius:20px;border:1px solid var(--ln);background:#0f1b24;color:var(--mut);font:700 14px Tajawal;cursor:pointer;transition:.2s}
.tab.on{background:linear-gradient(135deg,#ffe07a,#f2a900);color:#000;border-color:var(--gold);box-shadow:0 0 14px #ffc83d66}
.fc{padding:3px 12px;font-size:12px}.fc.on{border-color:var(--em);color:var(--em)}
.body{padding:4px 2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px}
.card{--rc:#9aa3b8;position:relative;background:linear-gradient(160deg,#10202a,#0a141b);border:2px solid var(--rc);border-radius:16px;padding:10px;font-size:13px;cursor:pointer;text-align:right;color:var(--tx);overflow:hidden;transition:transform .15s}
.card:active{transform:scale(.96)}
.card.r1{--rc:#4aa8ff}.card.r2{--rc:#b46bff}.card.r3{--rc:#ffc83d}.card.r4{--rc:#ff3b5c}
.card.r5{border:2px solid transparent;background:linear-gradient(#0d1a22,#0d1a22) padding-box,conic-gradient(from var(--a),#ff3b5c,#ffc83d,#19e08c,#7dd3fc,#b46bff,#ff3b5c) border-box;animation:rz2 3s linear infinite}
@keyframes rz2{to{--a:360deg}}
.card.r3::before,.card.r4::before,.card.r5::before{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#fff3,transparent);animation:sh 3.2s infinite}
@keyframes sh{to{left:130%}}
.card.on{box-shadow:0 0 20px var(--rc),inset 0 0 16px #19e08c33}
.card .n{font-weight:900;font-size:14px}.card .m{color:var(--mut);font-size:12px;margin-top:2px}.card .ok{color:var(--em);font-weight:700}
.bar{height:5px;background:#16262f;border-radius:4px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--em),var(--gold),var(--ruby))}
.lock{position:absolute;left:8px;top:6px;font-size:16px}.card.locked{filter:saturate(.7)}
.sw{height:30px;border-radius:9px;margin-bottom:6px;border:1px solid #fff3}
.row{display:flex;justify-content:space-between;align-items:center;background:#0f1b24;border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:8px;font-weight:700}
.tg{width:48px;height:27px;border-radius:20px;background:#27363f;border:0;position:relative;cursor:pointer;transition:.2s}
.tg::after{content:"";position:absolute;top:3px;right:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:var(--em)}.tg.on::after{right:24px}
input.pin{width:100%;padding:10px;border-radius:10px;border:2px solid var(--gold);background:#fff;color:#000;font:900 26px Tajawal;text-align:center;letter-spacing:5px;direction:ltr}
.dock{position:absolute;z-index:8;left:0;right:0;bottom:calc(14px + var(--sab));display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
.dock>*{pointer-events:auto}
.tune{border:2px solid var(--em);background:#0a1219dd;color:var(--em);border-radius:30px;padding:9px 30px;font:900 16px Tajawal;cursor:pointer;backdrop-filter:blur(8px)}
.go{position:relative;border:0;border-radius:40px;padding:10px 64px;font:400 30px Lalezar;color:#000;background:linear-gradient(135deg,#ffe07a,#f2a900);box-shadow:0 0 0 0 #ffc83daa,0 8px 24px #000;animation:glow 1.8s infinite;cursor:pointer;overflow:hidden}
.go::after{content:"";position:absolute;top:0;left:-60%;width:30%;height:100%;background:linear-gradient(100deg,transparent,#fff9,transparent);animation:sh 2.6s infinite}
.go:active{transform:scale(.93)}
@keyframes glow{70%{box-shadow:0 0 0 20px #ffc83d00,0 8px 24px #000}100%{box-shadow:0 0 0 0 #ffc83d00,0 8px 24px #000}}
.modal{position:fixed;inset:0;z-index:30;background:#000c;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.modal.show{display:flex}
.sheet{background:linear-gradient(#0c1820,#070d12);border:1px solid #19e08c44;border-radius:24px 24px 0 0;width:100%;max-width:900px;max-height:90%;overflow-y:auto;padding:14px;padding-bottom:calc(22px + var(--sab));animation:sl .28s}
@keyframes sl{from{transform:translateY(70px);opacity:0}}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.hd b{font:400 24px Lalezar}
.x{background:#16262f;border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}
.pk{position:relative;background:linear-gradient(160deg,#10202a,#0a141b);border:1.5px solid var(--ln);border-radius:16px;padding:14px 12px;margin:14px 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pk .ic{font-size:30px}.pk .nm{font-weight:900}.pk .ds{color:var(--mut);font-size:13px}
.pk.hot{border-color:var(--gold);background:linear-gradient(135deg,#2b2206,#0a141b);box-shadow:0 0 22px #ffc83d44}
.pk .t{position:absolute;top:-11px;right:12px;background:var(--ruby);color:#fff;font-weight:900;font-size:12px;padding:2px 11px;border-radius:10px;animation:bl 1.2s infinite}
@keyframes bl{50%{background:var(--gold);color:#000}}
.sv2{position:absolute;top:-11px;left:12px;background:var(--em);color:#000;font-weight:900;font-size:12px;padding:2px 10px;border-radius:10px}
.buy{border:0;background:linear-gradient(135deg,#ffe07a,#f2a900);color:#000;border-radius:22px;padding:10px 18px;font:900 15px Tajawal;cursor:pointer;white-space:nowrap}
.buy.done{background:#146c45;color:#fff;opacity:.9;cursor:default}
.pk.dn{opacity:.8}
#toast{position:fixed;z-index:70;top:calc(62px + var(--sat));left:50%;transform:translateX(-50%);background:#000e;border:1px solid var(--gold);padding:9px 18px;border-radius:20px;font-weight:700;display:none;max-width:90%;text-align:center}
#stamp{position:fixed;inset:0;z-index:65;display:none;place-items:center;pointer-events:none}
#stamp div{font:400 54px Lalezar;color:var(--em);border:6px solid var(--em);padding:6px 26px;border-radius:14px;transform:rotate(-10deg);text-shadow:0 0 22px var(--em);background:#000b;animation:st .5s cubic-bezier(.2,2,.4,1)}
@keyframes st{from{transform:rotate(-10deg) scale(3);opacity:0}}
#cf{position:fixed;inset:0;z-index:66;pointer-events:none}
#launch{position:fixed;inset:0;z-index:50;background:radial-gradient(circle,#06241a,#000 70%);display:none;align-items:center;justify-content:center;overflow:hidden}
#launch.show{display:flex}
.ray{position:absolute;left:50%;top:50%;width:3px;height:30vh;transform-origin:top center;background:linear-gradient(var(--gold),transparent);animation:ry .55s linear infinite}
@keyframes ry{from{transform:rotate(var(--r)) translateY(4vh);opacity:1}to{transform:rotate(var(--r)) translateY(75vh);opacity:0}}
#cd{position:relative;font:400 120px Lalezar;color:var(--gold);text-shadow:0 0 50px var(--gold);animation:zz .9s infinite;text-align:center}
@keyframes zz{from{transform:scale(2);opacity:0}to{transform:scale(1);opacity:1}}
#lspd{position:absolute;bottom:14%;font:400 30px Lalezar;color:var(--em);text-align:center}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}.flashon{animation:fa .5s}@keyframes fa{from{opacity:.9}}
#intro{position:fixed;inset:0;z-index:90;background:#000;display:grid;place-items:center;transition:opacity .6s;text-align:center}
#intro h1{font:400 56px Lalezar;color:var(--gold);text-shadow:0 0 40px var(--gold);animation:in 1.2s both}#intro p{color:var(--em);animation:in 1.2s .4s both}
@keyframes in{from{opacity:0;transform:scale(1.6);letter-spacing:12px}}
.dv{white-space:pre-wrap;line-height:1.9;font-size:14px;direction:rtl}
@media(prefers-reduced-motion:reduce){*{animation-duration:0s!important}}
.big{width:100%;margin-top:10px;padding:13px;font-size:18px}
[hidden]{display:none!important}
.wl{position:fixed;inset:0;z-index:80;background:#000d;display:none;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(4px)}
.wl.show{display:flex}
.wc{width:100%;max-width:520px;max-height:94%;overflow-y:auto;background:linear-gradient(#0c1820,#070d12);border:1px solid #19e08c55;border-radius:24px;padding:18px;animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.wh{font:400 34px Lalezar;color:var(--gold);text-align:center;text-shadow:0 0 22px var(--gold)}
.wt{margin:8px 0;line-height:1.8;text-align:center;white-space:pre-wrap}
.warn{background:#3a0f18;border:1px solid var(--ruby);border-radius:12px;padding:8px;text-align:center;font-weight:700;margin:8px 0}
.hero{margin:12px 0;padding:16px;border-radius:18px;text-align:center;border:2px solid transparent;background:linear-gradient(#2b2206,#0d1a22) padding-box,conic-gradient(from var(--a),#ffc83d,#19e08c,#ffc83d,#ff3b5c,#ffc83d) border-box;animation:rz2 3s linear infinite}
.hs{font-size:42px;animation:pls 2s infinite}.ht{font:400 24px Lalezar;color:var(--gold)}.hp{font-weight:900;margin:4px 0 8px}
.hero ul{list-style:none;padding:0;text-align:right;display:inline-block;font-size:14px;line-height:1.9}
.fh{font-weight:900;margin:6px 0 4px}
.fr{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.fc2{flex:none;width:132px;background:#10202a;border:1.5px solid var(--ln);border-radius:14px;padding:10px;text-align:center;font-size:12px;display:flex;flex-direction:column;gap:3px;animation:in2 .5s both}
@keyframes in2{from{opacity:0;transform:translateY(14px)}}
.fc2 .ic{font-size:28px}.fc2 small{color:var(--mut)}.fc2 span{color:var(--gold);font-weight:900}

@media (orientation:landscape) and (max-height:540px){
 #app{max-width:100%}
 .top{padding:6px 10px}
 .stage{min-height:110px}
 .go{padding:6px 44px;font-size:24px}
 .dock{flex-direction:row;gap:12px;bottom:calc(8px + var(--sab))}
 .sheet{max-height:94%;border-radius:18px 18px 0 0}
 #carSlot{height:100%;width:60%}
 .wc{max-height:100%}
 .wc .tune.big{position:sticky;bottom:6px;z-index:2}
}
body{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
</style>
</head>
<body>
<div id="intro"><div><h1>كراج السعودية</h1><p>جهّز وحشك الخارق</p></div></div>
<div id="app">
  <svg id="map" viewBox="0 0 400 700" preserveAspectRatio="xMidYMid slice"></svg>
  <div class="vig"></div>
  <div class="top">
    <div class="chip"><b id="pts">0</b><button class="plus" id="addPts" aria-label="شراء نقاط">+</button></div>
    <div class="lv" id="avatar"><div class="av"><span>🦅</span></div><div class="lvt">المستوى<b id="lvn">1</b><div class="xp"><i id="xpb"></i></div></div></div>
    <div class="sp"></div>
    <button class="ib" id="gift" aria-label="الهدية اليومية">🎁</button>
    <button class="ib" id="openStore" aria-label="المتجر">🛒</button>
  </div>
  <div class="quick">
    <button class="qc" data-qt="car"><span>🚘</span>السيارات</button>
    <button class="qc" data-qt="job"><span>💼</span>الوظائف</button>

function startCyberJob(j){cyS={endAt:Date.now()+16000,shield:5,score:0,cells:Array.from({length:9},()=>({a:false,u:0})),job:j};view='mini';renderCyber();miniTimer=setInterval(cyberTick,300)}
function cyberTick(){if(!cyS)return;const now=Date.now();if(now>=cyS.endAt||cyS.shield<=0)return finishCyber();cyS.cells.forEach(c=>{if(c.a&&now>c.u){c.a=false,c.u=0,cyS.shield--,sfx.err()}});if(Math.random()<.55){const idle=cyS.cells.map((c,i)=>c.a?-1:i).filter(i=>i>=0);if(idle.length){const i=idle[Math.floor(Math.random()*idle.length)];cyS.cells[i]={a:true,u:now+1400}}}renderCyber()}
function renderCyber(){if(!cyS)return;const left=Math.max(0,Math.ceil((cyS.endAt-Date.now())/1000)),grid=cyS.cells.map((c,i)=>`<button class="card cycell" data-cy="${i}" style="font-size:30px">${c.a?'💥':''}</button>`).join('');$('sheet').innerHTML=`<div class="hd"><b>🛡️ ${cyS.job.n}</b><button class="x" data-close>✕</button></div><div class="m" style="text-align:center;margin:6px 0">صد الهجمات قبل ما توصل — الوقت: ${left}ث</div><div class="m" style="text-align:center;margin-bottom:8px">الدرع: ${'❤'.repeat(Math.max(0,cyS.shield))}${'🖤'.repeat(Math.max(0,5-cyS.shield))} · النقاط: ${cyS.score}</div><div class="grid" style="grid-template-columns:repeat(3,1fr)">${grid}</div>`,$('modal').classList.add('show')}
function finishCyber(){if(miniTimer){clearInterval(miniTimer);miniTimer=null}const j=cyS.job,pay=Math.round(100+cyS.score*80);S.jobs[j.id]=Date.now(),S.points+=pay,S.xp+=10,cyS=null;stamp('+'+fmt(pay)+' ✔'),changed(),$('modal').classList.remove('show'),view=null}

function renderPhone(){if(!phS||!phS.cur)return;const left=Math.max(0,(phS.roundEnd-Date.now())/1000).toFixed(1),opts=PHONE_TYPES.map(t=>`<button class="card" data-ph="${t.id}" style="text-align:center"><div style="font-size:26px">${t.ic}</div><div class="n">${t.n}</div></button>`).join('');$('sheet').innerHTML=`<div class="hd"><b>📱 ${phS.job.n}</b><button class="x" data-close>✕</button></div><div class="m" style="text-align:center;margin-bottom:6px">جولة ${phS.round}/${phS.total} · النقاط: ${phS.score}</div><div style="text-align:center;font-size:54px;margin:10px 0">${phS.cur.ic}</div><div class="m" style="text-align:center;margin-bottom:10px">وش نوع هذا الجوال؟ (${left}ث)</div><div class="grid">${opts}</div>`,$('modal').classList.add('show')}
function finishPhone(){if(miniTimer){clearInterval(miniTimer);miniTimer=null}const j=phS.job,pay=Math.round(80+phS.score*70);S.jobs[j.id]=Date.now(),S.points+=pay,S.xp+=10,phS=null;stamp('+'+fmt(pay)+' ✔'),changed(),$('modal').classList.remove('show'),view=null}

 let h=`<div class="hd"><b>🛒 المتجر</b><button class="x" data-close>✕</button></div><div class="tabs">`+Object.keys(SECS).map(k=>`<button class="tab ${ssec===k?'on':''}" data-ss="${k}">${SECS[k]}</button>`).join('')+'</div>';
 PRODUCTS.filter(p=>p.sec===ssec).forEach(p=>{const d=bought(p);
  h+=`<div class="pk ${p.hot?'hot':''} ${d?'dn':''}">${p.tag&&!d?`<span class="t">${p.tag}</span>`:''}${p.id==='bd'&&!d?`<span class="sv2">وفّر ${SAVE} ${CONFIG.CUR}</span>`:''}<div style="display:flex;gap:10px;align-items:center"><div class="ic">${p.ic}</div><div><div class="nm">${p.n}</div><div class="ds">${p.id==='sub'&&d?('ينتهي في '+fdate(S.subExp)):p.d}</div></div></div><button class="buy ${d?'done':''}" data-b="${p.id}" ${d?'disabled':''}>${d?(p.id==='sub'?'مشترك ✔':'تم الشراء ✔'):p.sar+' '+CONFIG.CUR+(p.per||'')}</button></div>`});
 $('sheet').innerHTML=h;$('modal').classList.add('show')}

async function buy(id){const p=PRODUCTS.find(x=>x.id===id);if(!p||busy)return;if(bought(p)){toast('تم شراؤه مسبقاً');return}
 busy=true;let ok=false;
 try{if(typeof GB.purchase==='function')ok=(await GB.purchase({...p}))===true;else if(CONFIG.DEV_DEMO_MODE){ok=true;toast('وضع تجريبي: لا يوجد دفع حقيقي')}else toast('بوابة الدفع غير مربوطة بعد')}catch(e){toast('فشل الدفع، حاول مرة أخرى')}
 busy=false;if(!ok){sfx.err();return}
 if(p.id==='sub'){S.subExp=nextMonth(nowT());S.subWas=true}else{S.points+=p.pts||0;if(p.e128)S.owned.add('e128');if(p.own)S.owned.add(p.own);if(p.all)ALL.forEach(a=>S.owned.add(a));S.bought.add(p.id)}
 sfx.buy();vib([30,40,30]);stamp('تم الشراء ✔');changed();store();if(p.id==='sub')toast('👑 تم فتح كل شيء: المحركات والصبغات واللوحة + نقاط غير محدودة ∞')}

function confetti(){if(!S.set.hq)return;const c=$('cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
 const P=Array.from({length:100},()=>({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*15,vy:-Math.random()*15-4,s:4+Math.random()*5,c:['#ffc83d','#19e08c','#ff3b5c','#7dd3fc','#fff'][Math.random()*5|0],r:Math.random()*6}));let n=0;
 (function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++n<120)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}

 else if(d.car){const c=CARS.find(x=>x.id===d.car);
  if(S.cars.has(c.id)){if(S.car!==c.id){S.car=c.id;vib();changed();remountCar()}}

  else{sfx.err();toast('نقاطك لا تكفي');store('packs')}}
 else if(d.house){const ho=HOUSES.find(x=>x.id===d.house);
  if(S.houses.has(ho.id)){vib()}
  else if(S.points>=ho.price){S.points-=ho.price;S.houses.add(ho.id);S.xp+=15;sfx.buy();stamp('تم الشراء ✔');changed()}
  else{sfx.err();toast('نقاطك لا تكفي');store('packs')}}
 else if(d.job){const j=JOBS.find(x=>x.id===d.job),now=Date.now(),last=S.jobs[j.id]||0;
  if(now-last<j.cd){sfx.err();vib()}
  else if(j.kind==='cyber')startCyberJob(j);
  else if(j.kind==='phones')startPhoneJob(j);
  else{S.jobs[j.id]=now;S.points+=j.pay;S.xp+=5;sfx.buy();stamp('+'+fmt(j.pay)+' ✔');changed()}}
 else if(d.e){const m=ENGINES.find(x=>x.id===d.e);
  if(ownE(m)){S.engine=m.id;vib();changed()}
  else if(m.premium){sfx.err();toast('🔒 المحرك الخرافي يفتح بباقة التريليون');store('packs')}
  else if(S.points>=m.price)confirmEng(m);
  else{sfx.err();toast('نقاطك لا تكفي');store('packs')}}
 else if(d.ce){const m=ENGINES.find(x=>x.id===d.ce);if(S.points>=m.price&&!ownE(m)){S.points-=m.price;S.engines.add(m.id);S.engine=m.id;S.xp+=15;sfx.buy();stamp('تم الشراء ✔')}view='tune';changed()}
 else if(d.p){const p=PAINTS.find(x=>x.id===d.p);
  if(p.lock&&!has(p.lock)){sfx.err();toast('🔒 مقفل، اشتره من المتجر');store('paint')}
  else if(p.fx){S.fx=!S.fx;changed()}else{S.paintId=p.id;changed()}}
 else if(d.s!==undefined&&t.classList.contains('card')){S.sticker=d.s;changed()}
 else if(d.g){S.set[d.g]=!S.set[d.g];if(d.g==='music')music();vib();changed()}
 else if(d.wl)closeWelcome(d.wl==='sub')
 else if(d.lang){S.set.lang=S.set.lang==='en'?'ar':'en';applyLang();changed()}
 else if('reset' in d){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}
 else if(d.b)buy(d.b);
 else if(d.open)store(d.open);
 else if('cy' in d){if(cyS){const i=+d.cy,c=cyS.cells[i];if(c&&c.a){c.a=false,c.u=0,cyS.score++,sfx.tap(),renderCyber()}}}
 else if('ph' in d){if(phS&&phS.cur){d.ph===phS.cur.id?(phS.score++,sfx.buy()):sfx.err();nextPhoneRound()}}
 else if('close' in d){if(miniTimer){clearInterval(miniTimer);miniTimer=null}cyS=null,phS=null;$('modal').classList.remove('show');view=null}
 else if(t.id==='addPts')store('packs');
 else if(t.id==='openStore')store('sub');
 else if(t.id==='tune')tune();
 else if(d.qt){tab=d.qt;tune()}
 else if(t.id==='gift'){const td=new Date().toDateString();if(S.daily===td)toast('تعال بكرة للهدية الجاية 🎁');else{S.daily=td;S.points+=CONFIG.DAILY_REWARD;sfx.buy();vib([30,40,30]);stamp('🎁 +'+fmt(CONFIG.DAILY_REWARD));changed()}}
 else if(t.id==='go')launch()});

const orig=new WeakMap(),outT=new WeakMap();
const trs=t=>{for(const[a,e]of TRX)if(t.includes(a))t=t.split(a).join(e);return t};
function trNode(n){const p=n.parentNode;if(!p||p.nodeName==='SCRIPT'||p.nodeName==='STYLE'||outT.get(n)===n.data)return;orig.set(n,n.data);const t=trs(n.data);if(t!==n.data){outT.set(n,t);n.data=t}}
function applyLang(){const en=S.set.lang==='en';try{localStorage.setItem('sg.lang',S.set.lang)}catch(e){}document.documentElement.lang=en?'en':'ar';document.documentElement.dir=en?'ltr':'rtl';
 const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){if(n.parentNode.nodeName==='SCRIPT')continue;
  if(!orig.has(n)||outT.get(n)!==n.data)orig.set(n,n.data);const t=en?trs(orig.get(n)):orig.get(n);if(t!==n.data){outT.set(n,t);n.data=t}}}
new MutationObserver(ms=>{if(S.set.lang!=='en')return;ms.forEach(m=>{if(m.type==='characterData')trNode(m.target);m.addedNodes.forEach(a=>{if(a.nodeType===3)trNode(a);else if(a.nodeType===1){const w=document.createTreeWalker(a,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode())trNode(n)}})})}).observe(document.body,{childList:true,subtree:true,characterData:true});

if(enforce())save();
drawMap();mountCar();render();applyLang();
